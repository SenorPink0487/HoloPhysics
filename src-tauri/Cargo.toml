[package]
name = "DAWU"
version = "0.2.3"
description = "DAWU"
authors = ["wuli"]
edition = "2021"

[lib]
name = "dawu_lib"
# Desktop-only: rlib is enough. Including cdylib on MinGW triggers
# "export ordinal too large" linker failures. Add "staticlib", "cdylib" for mobile.
crate-type = ["rlib"]

[[bin]]
name = "DAWU"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

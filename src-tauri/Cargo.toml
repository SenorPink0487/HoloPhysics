[package]
name = "quantum-physics-lab"
version = "0.1.0"
description = "未来物理实验室 — interactive 3D physics lab (Tauri 2)"
authors = ["wuli"]
edition = "2021"

[lib]
name = "quantum_physics_lab_lib"
# Desktop-only: rlib is enough. Including cdylib on MinGW triggers
# "export ordinal too large" linker failures. Add "staticlib", "cdylib" for mobile.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
